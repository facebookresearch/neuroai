data:
  study:
    source:
      name: Chang2019Bold5000
    split:
      name: PredefinedSplit
      test_split_query: null
      col_name: split
      valid_split_by: timeline
      valid_split_ratio: 0.2
      valid_random_state: 33
  target:
    name: HuggingFaceImage
    model_name: facebook/dinov2-giant
    layers: 0.6667
    token_aggregation: mean
    imsize: 518
    aggregation: trigger
    infra:
      cluster: !!python/name:neuralbench.config_manager.CLUSTER
      keep_in_ram: false
      timeout_min: 180
      gpus_per_node: 1
      cpus_per_task: 10
      min_samples_per_job: 64
  trigger_event_type: Image
  start: 2.0
  duration: 7.0
space_name: mni2fsaverage5
available_spaces: [mni, mni2fsaverage4, mni2fsaverage5, mni2fsaverage6]
brain_model_output_size: &brain_model_output_size 1536
brain_model_config:
  output_head_config:
    hidden_sizes:
      - *brain_model_output_size
trainer_config.monitor: val/batch_inv_norm_rank_mean
trainer_config.mode: max
loss:
  name: ClipLoss
  norm_kind: y
  temperature: false
  symmetric: false
metrics: !!python/name:neuralbench.metric_configs.retrieval_metrics
test_full_retrieval_metrics: !!python/name:neuralbench.metric_configs.test_full_retrieval_metrics
