# emg2qwerty CTC task: surface-EMG → QWERTY keystroke sequence.

# Paper recipe optimizer (Adam + OneCycleLR, lr 1e-8 → 1e-3 → 1e-6 with
# 40 % warmup).  Without the slow warmup CTC collapses to all-blank
# within an epoch.
lightning_optimizer_config:
  =replace=: true
  optimizer:
    name: Adam
    lr: 1.0e-3
    kwargs: {}
  scheduler:
    name: OneCycleLR
    kwargs:
      max_lr: 1.0e-3
      pct_start: 0.4
      anneal_strategy: cos
      div_factor: 1.0e+5
      final_div_factor: 1.0e+3
  interval: step
data:
  batch_size: 16
  study:
    source:
      name: Emg2qwerty
    split:
      name: SklearnSplit
      split_by: subject
      valid_split_ratio: 0.2
      test_split_ratio: 0.2
      valid_random_state: 33
      test_random_state: 33
  neuro:
    =replace=: true
    name: EmgExtractor
    picks: [emg]
    frequency: 2000.0
    filter: null
    notch_filter: null
    baseline: null
    scaler: null
    clamp: null
    infra:
      cluster: auto
      folder: !!python/name:neuralbench.config_manager.CACHE_DIR
      keep_in_ram: true
      slurm_partition: !!python/name:neuralbench.config_manager.SLURM_PARTITION
      timeout_min: 180
      gpus_per_node: 1
      cpus_per_task: 10
      min_samples_per_job: 200
  target:
    =replace=: true
    name: KeystrokeSequence
    max_target_length: 128
    # CTC accepts empty targets; segments without keystrokes return
    # length-0 instead of raising.
    allow_missing: true
    # Targets cover the un-padded 4 s "core" of the padded 5 s window.
    core_start_offset: 0.9
    core_duration: 4.0
    key_to_label: !!python/name:neuralbench.tasks.emg.qwerty.charset.PAPER_KEY_TO_LABEL
    unichar_to_key: !!python/name:neuralbench.tasks.emg.qwerty.charset.PAPER_UNICHAR_TO_KEY
  # Paper-faithful sliding-window segmentation: 4 s core + 0.9 s left +
  # 0.1 s right padding; stride = core duration so windows abut.
  trigger_event_type: Emg2qwertyRaw
  start: -0.9
  duration: 5.0
  stride: 4.0
  stride_drop_incomplete: true
  summary_columns: [text]
brain_model_output_size: 99      # 98 keys + CTC blank
trainer_config.monitor: val/CER
trainer_config.mode: min
loss:
  =replace=: true
  name: CtcSeqLoss
  blank: 98
  zero_infinity: true
metrics:
  - name: CharacterErrorRates
    log_name: CER
    kwargs:
      blank_idx: 98
