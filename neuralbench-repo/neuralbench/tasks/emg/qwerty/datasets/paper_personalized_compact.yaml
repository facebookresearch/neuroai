# Personalized recipe with the compact 51-class vocabulary: case-folded
# letters + US-QWERTY shift-folded symbols + Key.shift dropped.
data:
  study:
    source:
      query: "subject == 'Emg2qwerty/70495563'"
    split:
      split_by: session
  target:
    key_to_label: !!python/name:neuralbench.tasks.emg.qwerty.charset.COMPACT_KEY_TO_LABEL
    unichar_to_key: !!python/name:neuralbench.tasks.emg.qwerty.charset.COMPACT_UNICHAR_TO_KEY
    input_folds: !!python/name:neuralbench.tasks.emg.qwerty.charset.COMPACT_INPUT_FOLDS
brain_model_output_size: 51
loss:
  =replace=: true
  name: CtcSeqLoss
  blank: 50
  zero_infinity: true
metrics:
  - name: CharacterErrorRates
    log_name: CER
    kwargs:
      blank_idx: 50
