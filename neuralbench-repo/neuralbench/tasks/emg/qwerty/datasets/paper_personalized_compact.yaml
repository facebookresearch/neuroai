# emg2qwerty paper recipe — personalized, compact 51-class vocabulary.
#
# Same data subset + optimizer / augmentation as ``paper_personalized``,
# but the target vocabulary is collapsed from 99 (paper) to 51 classes
# by folding uppercase letters into their lowercase equivalents and
# US-QWERTY shifted symbols (``!@#$%^&*()`` plus the punctuation row)
# into their unshifted base, then dropping the ``Key.shift`` modifier
# (now redundant).
#
# With enough data and a big-enough model, the network can learn
# capitalization / punctuation from context, so a compact decoder
# vocabulary trains faster and gives better per-class statistics.  The
# output stream needs a downstream language model / post-processor to
# recover capitalization if you care about it.
#
# Pair with ``--checkpoint /path/to/upstream_generic.ckpt`` only if
# upstream's classifier head matches: upstream's 98-class head is
# remapped via ``EMG2QwertyNet.mapping`` but its output dim is fixed at
# 99, so loading into a 51-class model would size-mismatch the head.
# For that case use ``paper_personalized_finetune.yaml`` instead.
#
# >>> EDIT THE SUBJECT BELOW <<<
data:
  study:
    source:
      query: "subject == 'Emg2qwerty/70495563'"
    split:
      split_by: session
  target:
    vocab_preset: qwerty_compact
brain_model_output_size: 51   # 50 keys + CTC blank
loss:
  =replace=: true
  name: CTCLoss
  kwargs:
    blank: 50
    zero_infinity: true
