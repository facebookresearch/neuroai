# emg2qwerty fine-tune-from-pretrained recipe — personalized.
#
# Pair with ``--checkpoint /path/to/upstream_generic.ckpt`` so the
# upstream emg2qwerty TDS weights load before training starts (the
# ``EMG2QwertyNet.mapping`` declared in braindecode handles the
# ``model.4.{weight,bias} → final_layer.{weight,bias}`` rename inside
# ``neuralbench.utils.load_checkpoint``).
#
# Empirically validated on an A40: zero-shot val/CER from the upstream
# generic checkpoint is ≈ 16 % on a held-out subject (sub-01438774).
# The from-scratch ``paper_personalized.yaml`` recipe (Adam max_lr=1e-3,
# pct_start=0.4, SpecAugment from epoch 2, BandRotation from epoch 0)
# drives that to ≈ 75 % within 5 epochs by overshooting the pretrained
# minimum.  This overlay halves max_lr by 100×, shortens the warmup,
# and defers both augmentations.
#
# >>> EDIT THE SUBJECT BELOW <<<
data:
  study:
    source:
      query: "subject == 'Emg2qwerty/70495563'"
    split:
      split_by: session
lightning_optimizer_config:
  =replace=: true
  optimizer:
    name: Adam
    lr: 1.0e-5
    kwargs: {}
  scheduler:
    name: OneCycleLR
    kwargs:
      max_lr: 1.0e-5
      pct_start: 0.1
      anneal_strategy: cos
      div_factor: 1.0e+2
      final_div_factor: 1.0e+2
  interval: step
# Override the model-level callback defaults: defer both augmentations
# so the fine-tuner can adapt the head before adding noise to inputs.
train_callbacks:
  - name: SpecAugment
    start_epoch: 5
  - name: BandRotation
    start_epoch: 3
