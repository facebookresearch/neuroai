data:
  study:
    source:
      name: Harati2015Tuev
    split:
      name: PredefinedSplit
      test_split_query: "split == 'eval'"
      col_name: split
      valid_split_by: subject
      valid_split_ratio: 0.2
      valid_random_state: 33
  neuro:
    # Match the 23-channel order used by the official NeuroLM TUEV loader.
    picks:
      - Fp1
      - Fp2
      - F3
      - F4
      - C3
      - C4
      - P3
      - P4
      - O1
      - O2
      - F7
      - F8
      # NeuralFetch canonicalizes the original TUEV legacy names before
      # channel selection: T3/T4/T5/T6 -> T7/T8/P7/P8 and A1/A2 -> T9/T10.
      - T7
      - T8
      - P7
      - P8
      - T9
      - T10
      - Fz
      - Cz
      - Pz
      # T1/T2 (canonical FT9/FT10) are absent from part of the TUEV corpus.
      # Keep the 21-channel intersection rather than fabricating missing EEG
      # channels or failing preprocessing for those recordings.
  target:
    =replace=: true
    name: LabelEncoder
    event_types: [EpileptiformActivity, Artifact]
    event_field: state
    return_one_hot: true
    aggregation: trigger
    allow_missing: false
  trigger_event_type: [EpileptiformActivity, Artifact]
  start: -1.0
  duration: 3.0
  stride: 1.0
  stride_drop_incomplete: false
  summary_columns: [state]
compute_class_weights: true
brain_model_output_size: &brain_model_output_size 6
trainer_config.monitor: val/f1_score_macro
trainer_config.mode: max
loss:
  =replace=: true
  name: CrossEntropyLoss
metrics: !!python/object/apply:neuralbench.defaults.metrics.get_classification_metric_configs
  - *brain_model_output_size
