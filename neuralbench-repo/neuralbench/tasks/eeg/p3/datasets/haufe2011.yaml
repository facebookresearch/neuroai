data:
  study:
    source:
      name: Haufe2011Eeg
    split:
      name: SklearnSplit
      split_by: subject
      valid_split_ratio: 0.2
      test_split_ratio: 0.2
      valid_random_state: 33
      test_random_state: 33
  # MOABB's SetRawAnnotations shifts every BNCI2016_002 annotation by
  # interval[0] = -0.5 s, so events.start sits at t_stim - 0.5 s. start=0.8
  # therefore selects [+0.3, +1.3] s relative to the TRUE brake onset, which is
  # the window this task used when neuralfetch loaded the .mat itself.
  # Baseline [0.0, 0.2] is in epoch-local coords and is unaffected.
  neuro.baseline: [0.0, 0.2]
  start: 0.8
  duration: 1.0
