# motor_imagery on dreyer2026proteus, tested as streams; diff guarded by test_stream_task_diff
# Local subject-disjoint benchmark on the training release, not the official
# split or the sealed protocol.

data:
  neuro:
    frequency: 120.0
    filter: [0.1, 75.0]
    notch_filter: [50.0, 60.0]
    scaler: null
    clamp: null
    scale_factor: 1.0e+6  # V -> uV
  study:
    source:
      name: Dreyer2026Proteus
    split:
      name: SklearnSplit
      split_by: subject
      valid_split_ratio: 0.2
      test_split_ratio: 0.2
      valid_random_state: 33
      test_random_state: 33
  target:
    =replace=: true
    name: LabelEncoder
    event_types: Stimulus
    event_field: code
    return_one_hot: true
    aggregation: trigger
  trigger_event_type: Stimulus
  start: 1.0  # cue at 0 s, feedback from 3 s, trial end at 8 s
  duration: 4.0
  summary_columns: [code]
  test_batch_size: 1
  stream_by: [subject, session]
compute_class_weights: true
brain_model_output_size: &brain_model_output_size 3
trainer_config.monitor: val/bal_acc_stream_mean
trainer_config.mode: max
loss:
  name: CrossEntropyLoss
  kwargs:
    label_smoothing: 0.1
metrics: !!python/object/apply:operator.add
  - !!python/object/apply:neuralbench.metric_configs.get_classification_metric_configs
    - *brain_model_output_size
  - - log_name: bal_acc_stream_mean  # balanced accuracy per stream, averaged over streams
      name: GroupedMetric
      metric_name: Accuracy
      kwargs: {task: multiclass, num_classes: *brain_model_output_size, average: macro}
      reduction: mean
