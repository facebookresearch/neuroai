# Single-window sleep-onset task. One fixed-length EEG crop per night ending at
# a random cut drawn around N2 onset; the model returns one signed
# time-to-onset value per night. Because every crop has the same length and
# there is no window grid, no window count or length leaks the target, and the
# continuous cut avoids a zero-target pile-up (see AddSleepOnsetCutTargets).
# Diff to sleep_onset is guarded by test_sleep_onset_stream_diff.

data:
  study:
    source:
      name: Kemp2000Analysis
    split:
      name: SklearnSplit
      split_by: subject
      valid_split_ratio: 0.2
      test_split_ratio: 0.2
      valid_random_state: 33
      test_random_state: 33
    annotate_sleep_onset:
      name: AddSleepOnsetCutTargets
      window_s: 30.0
      lead_s: 300.0
      lag_s: 60.0
      n_eval_windows: 1
      n_train_windows: 20
      seed: 0
  # Sleep-EDF (Kemp2000) recordings only expose bipolar derivations (Fpz-Cz,
  # Pz-Oz) whose MNE ch_locs are NaN, so the default ``ch_locs``-derived
  # position mapping in ``ChannelPositions`` produces all-``INVALID_VALUE``
  # positions.  Explicitly use the standard_1020 montage so the split-on-``-``
  # fallback resolves Fpz-Cz -> Fpz and Pz-Oz -> Pz to real 3D coordinates.
  channel_positions:
    layout_or_montage_name: standard_1020
  target:
    =replace=: true
    name: SleepOnsetTargetExtractor
    event_types: SleepOnsetMarker
    aggregation: trigger
    # Signed target n2_onset - t_cut, in [-lag_s, +lead_s].
    floor_s: -60.0
    cap_s: 300.0
  trigger_event_type: SleepOnsetMarker
  start: 0.0
  # Single-window segmentation: one segment per marker = the window_s crop.
  duration: null
  stride: null
  sampler:
    name: RegressionBinSampler
    bin_edges: [-60.0, 0.0, 40.0, 90.0, 300.0]
  summary_columns: [n2_onset]
brain_model_output_size: &brain_model_output_size 1
trainer_config:
  monitor: val/bmae
  mode: min
  patience: 7
  n_epochs: 40
loss:
  name: MultiLoss
  losses:
    mse:
      name: MSELoss
  weights:
    mse: 0.0001  # signed targets in [-60, 300] s; small weight keeps MSE from saturating gradient clipping.
metrics: !!python/object/apply:neuralbench.defaults.metrics.get_sleep_onset_metric_configs
  - [-60.0, 0.0, 40.0, 90.0, 300.0]
