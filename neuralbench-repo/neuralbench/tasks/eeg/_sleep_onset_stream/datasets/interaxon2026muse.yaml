# Local subject-disjoint benchmark, not the supplied session split or sealed protocol.
data:
  study:
    =replace=: true
    source:
      name: Interaxon2026Muse
    split:
      name: SklearnSplit
      split_by: subject
      valid_split_ratio: 0.2
      test_split_ratio: 0.2
      valid_random_state: 33
      test_random_state: 33
    annotate_sleep_onset:
      name: AddSleepOnsetTargets
      max_pre_n2_s: 1200.0
      random_start_splits: [val, test]
