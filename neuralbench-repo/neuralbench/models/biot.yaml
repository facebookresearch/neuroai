data:
  neuro:
    frequency: 200.0
    filter: null
    notch_filter: null
    baseline: null
    scaler: null
    scale_factor: null
    clamp: null
  channel_positions:
    include_ref_eeg: false
brain_model_config:
  =replace=: true
  name: BIOT
  from_pretrained_name: braindecode/biot-pretrained-six-datasets-18chs
  kwargs:
    n_times: 1000
    return_feature: true
downstream_model_wrapper:
  on_the_fly_preprocessor:
    scaler: QuantileAbsScaler
    scaler_quantile: 0.95
    scale_dim: -1
  preprocess_after_adapter: true  # upstream scales the bipolar derivations
  # +/-1 pairs on top of Kaiming init: an all-zero row freezes (|stft(0)| = 0)
  channel_adapter_config:
    n_target_channels: 18
    init: bipolar
    target_channel_names:  # pretraining order: 16 TCP pairs + C3-A2, C4-A1
      - FP1-F7
      - F7-T7
      - T7-P7
      - P7-O1
      - FP2-F8
      - F8-T8
      - T8-P8
      - P8-O2
      - FP1-F3
      - F3-C3
      - C3-P3
      - P3-O1
      - FP2-F4
      - F4-C4
      - C4-P4
      - P4-O2
      - C3-A2
      - C4-A1
    rename_mapping: !include channel_mappings/standard_1020.json
  model_output_key: 1
  aggregation: null  # the encoder mean-pools its patches: (B, emb_dim)
  # encoder.transformer.layers.layers.*.0.fn.{to_q,to_k,to_v,to_out}
  lora_target_modules:
    - to_q
    - to_k
    - to_v
    - to_out

# Paper config (Yang et al., NeurIPS 2023): Adam lr 1e-3 wd 1e-5, 100ep, batch 512, mean pool + ELU+Linear head, full FT.
