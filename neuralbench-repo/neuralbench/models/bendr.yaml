data:
  neuro:
    frequency: 256.0
    filter: null
    notch_filter: null
    baseline: null
    scaler: null  # NtBendr min-max scales each window
    scale_factor: null
    clamp: null
brain_model_config:
  =replace=: true
  name: NtBendr
  from_pretrained_name: braindecode/braindecode-bendr
  kwargs:
    final_layer: false
downstream_model_wrapper:
  # identity-init by name: a pass-through on 10-20 montages at step 0
  channel_adapter_config:
    n_target_channels: 19
    init: identity
    target_channel_names:
      - Fp1
      - Fp2
      - F7
      - F3
      - Fz
      - F4
      - F8
      - T7
      - C3
      - Cz
      - C4
      - T8
      - P7
      - P3
      - Pz
      - P4
      - P8
      - O1
      - O2
    rename_mapping: !include channel_mappings/standard_1020.json
  aggregation: mean  # start token included
  # whole nn.MultiheadAttention: it never calls out_proj
  lora_target_modules:
    - self_attn
trainer_config:
  gradient_clip_val: 0.5
lightning_optimizer_config:
  optimizer:
    name: AdamW
    lr: 1.0e-5
    kwargs:
      weight_decay: 0.05
  scheduler:
    name: OneCycleLR
    kwargs:
      max_lr: 1.0e-5
      pct_start: 0.1
      anneal_strategy: cos
  interval: step
csv_config: {}  # per-step loss curves

# Paper config (Kostas et al., Front. Hum. Neurosci. 2021): Adam lr 1e-5-5e-5 wd 0.01, cosine+10% warmup, full FT, linear head on CLS.
