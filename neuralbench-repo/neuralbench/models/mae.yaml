# Reference self-supervised baseline, pretrained by `neuraltrain-repo/ssl_example`.
# It has no published weights, so it is only meaningful together with
# `--checkpoint <your pretrained encoder>`.
#
# Every value below must match the pretraining run: preprocessing mirrors
# `ssl_example`'s "input" extractor, and `dim` / `patch_size` mirror its
# `brain_model_config`.  A mismatch is not an error -- `load_checkpoint` logs
# "Size mismatch" and keeps the randomly initialised layer.
data:
  neuro:
    frequency: 120.0
    filter:
      - 0.5
      - 25.0
    baseline: null
    scaler: RobustScaler
    clamp: 16.0
brain_model_config:
  =replace=: true
  name: MaeEncoder
  dim: 256
  patch_size: 32
# Built with n_outputs=None, so the encoder emits a token sequence that the
# probe pools over, rather than class scores.
downstream_model_wrapper:
  model_output_key: null
  aggregation: mean
  probe_config: linear
  # Linear probe: `[""]` matches no layer name, so the whole encoder freezes and
  # only the probe trains.  Drop this line to fine-tune the encoder too.
  layers_to_unfreeze: [""]
