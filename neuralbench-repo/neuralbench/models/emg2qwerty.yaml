# EMG2QwertyNet (Sivakumar et al., NeurIPS 2024) — pairs with the
# ``emg/qwerty`` CTC task.  Augmentation callbacks are bundled with the
# model: SpecAugment hooks ``model.spectrogram`` (only this model exposes
# it), and BandRotation assumes the 2 × 16 wristband layout.
brain_model_config:
  =replace=: true
  name: EMG2QwertyNet
  kwargs:
    log_softmax: true
train_callbacks:
  - name: SpecAugment
    start_epoch: 2
  - name: BandRotation
