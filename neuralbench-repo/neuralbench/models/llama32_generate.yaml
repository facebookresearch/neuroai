# Generative multilabel EEG baseline: response text is parsed into benchmark labels.
brain_model_config:
  =replace=: true
  name: Llama32EEGGenerate
  model_name: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  n_eeg_tokens: 16
  max_new_tokens: 64
  constrain_event_list: true
  torch_dtype: bfloat16

downstream_model_wrapper: null
# The task's BCE loss declares multilabel targets; generative_step trains on
# token cross-entropy and reports it separately as lm_loss.
compute_class_weights: false
save_test_predictions: true
data:
  batch_size: 2
trainer_config:
  precision: bf16-mixed
