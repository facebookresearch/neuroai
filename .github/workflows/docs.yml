name: Docs
# published layout: see docs/scripts/publish_docs.py

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || inputs.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or release tag to build and publish (e.g. v0.4.0)
        required: true
        default: main

jobs:
  # read-only: tutorials and PR code run here
  build-docs:
    name: Build documentation
    # Require 8-core machines (Github Actions Larger Runners) to have more than 14GB disk space
    runs-on: 8-core-ubuntu  # ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # publishing scripts from the workflow commit: an old tag may predate them
      - uses: actions/checkout@v4
        with:
          path: publish-tools
          sparse-checkout: docs/scripts
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env

      - name: Test publishing script
        run: |
          source .venv/bin/activate
          pytest publish-tools/docs/scripts/test_publish_docs.py

      - name: Install Sphinx extras
        run: |
          source .venv/bin/activate
          pip install sphinx furo myst_parser sphinx_rtd_theme sphinx-copybutton sphinx-design sphinx-gallery

      - name: Sphinx build
        run: |
          source .venv/bin/activate
          make -C docs html

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

  publish-docs:
    name: Publish documentation
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: publish-tools
          sparse-checkout: docs/scripts
          persist-credentials: false
      # separate full checkout: a worktree of a sparse checkout cannot stage the site
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: html
      # PRs run everything up to the push, as a publish of main
      - name: Push to gh-pages
        env:
          REF: ${{ github.event_name == 'pull_request' && 'main' || inputs.ref || github.ref_name }}
        run: |
          export GIT_AUTHOR_NAME=github-actions[bot] GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          export GIT_COMMITTER_NAME=$GIT_AUTHOR_NAME GIT_COMMITTER_EMAIL=$GIT_AUTHOR_EMAIL
          # single orphan commit keeps the branch small; the lease retries concurrent deploys
          for attempt in 1 2 3; do
            git -C site fetch --depth 1 origin gh-pages
            lease=$(git -C site rev-parse FETCH_HEAD)
            git -C site reset --quiet --hard "$lease"
            git -C site clean --quiet -dfx
            python3 publish-tools/docs/scripts/publish_docs.py site html "$REF"
            git -C site add --all
            commit=$(git -C site commit-tree "$(git -C site write-tree)" -m "Publish docs for $REF")
            [ "$GITHUB_EVENT_NAME" = pull_request ] && exit 0
            git -C site push --force-with-lease="gh-pages:$lease" origin "$commit:refs/heads/gh-pages" && exit 0
          done
          exit 1
